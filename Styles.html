<style>
/* ===== RESET & ROOT VARIABLES ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #0f4c81;
  --primary-dark: #083763;
  --primary-light: #1a6bb5;
  --primary-subtle: #e8f2fc;
  --accent: #f0a500;
  --accent-dark: #c98900;
  --accent-light: #fef3c7;
  --success: #16a34a;
  --success-bg: #dcfce7;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
  --warning: #d97706;
  --warning-bg: #fef3c7;
  --info: #0284c7;
  --info-bg: #e0f2fe;
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface2: #f8fafc;
  --border: #cbd5e1;
  --border-subtle: #e2e8f0;
  --text: #0f172a;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --sidebar-w: 260px;
  --topbar-h: 64px;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-full: 9999px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
  --shadow-md: 0 4px 18px rgba(15,76,129,.1);
  --shadow-lg: 0 16px 40px rgba(15,76,129,.14);
}

html, body {
  width: 100%;
  min-height: 100%;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   HALAMAN LOGIN (TERUJI & BEBAS ERROR DISPLAY)
   ============================================================ */
.login-screen {
  min-height: 100vh;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #072746 0%, #0f4c81 60%, #0a365c 100%);
  padding: 30px 16px;
  box-sizing: border-box;
  overflow-x: hidden;
  position: relative;
}

.login-container {
  width: 100%;
  max-width: 430px;
  margin: auto;
  position: relative;
  z-index: 10;
}

.login-card {
  background: #ffffff;
  border-radius: 18px;
  padding: 36px 30px;
  box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.4);
}

.login-header {
  text-align: center;
  margin-bottom: 24px;
}

.login-logo-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
  color: #083763;
  font-size: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 18px rgba(240, 165, 0, 0.35);
  margin-bottom: 12px;
}

.login-title {
  font-size: 21px;
  font-weight: 800;
  color: var(--primary-dark);
  letter-spacing: -0.3px;
  line-height: 1.25;
}

.login-subtitle {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 5px;
}

.login-alert {
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 18px;
  font-size: 12.5px;
  font-weight: 600;
  display: none;
  align-items: center;
  gap: 10px;
}
.login-alert.show { display: flex; }
.login-alert.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(220, 38, 38, 0.25); }
.login-alert.success { background: var(--success-bg); color: var(--success); border: 1px solid rgba(22, 163, 74, 0.25); }

.form-group-login {
  margin-bottom: 16px;
}

.form-group-login label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.input-icon-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.input-icon-wrap i.prefix-icon {
  position: absolute;
  left: 14px;
  color: var(--text-light);
  font-size: 14px;
  pointer-events: none;
}

.input-icon-wrap input {
  width: 100%;
  padding: 11px 42px 11px 38px;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  font-family: inherit;
  font-size: 13.5px;
  color: var(--text);
  background: var(--surface2);
  transition: all 0.2s;
  box-sizing: border-box;
}

.input-icon-wrap input:focus {
  outline: none;
  border-color: var(--primary);
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.15);
}

.btn-toggle-pass {
  position: absolute;
  right: 8px;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 8px;
  font-size: 14px;
}
.btn-toggle-pass:hover { color: var(--primary); }

.login-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  font-size: 12.5px;
}

.remember-label {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  color: var(--text-muted);
  font-weight: 500;
}

.btn-login-submit {
  width: 100%;
  padding: 12px 20px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #ffffff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  box-shadow: 0 6px 16px rgba(15, 76, 129, 0.3);
  transition: all 0.2s;
}

.btn-login-submit:hover {
  background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
  transform: translateY(-1px);
}
.btn-login-submit:disabled { opacity: 0.7; cursor: not-allowed; }

.demo-accounts {
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px dashed var(--border);
}

.demo-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text-muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.demo-pills {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.demo-pill {
  padding: 8px 6px;
  background: var(--surface2);
  border: 1.5px solid var(--border-subtle);
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.18s;
}

.demo-pill:hover {
  background: var(--primary-subtle);
  border-color: var(--primary);
  transform: translateY(-1px);
}

.demo-pill strong {
  display: block;
  font-size: 12px;
  color: var(--primary-dark);
}

.demo-pill span {
  display: block;
  font-size: 10px;
  color: var(--text-muted);
}

.login-footer-text {
  text-align: center;
  margin-top: 18px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.65);
}

/* ============================================================
   APLIKASI UTAMA (DASHBOARD & TRANSAKSI)
   ============================================================ */
#app {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-w);
  height: 100vh;
  min-height: 100vh;
  background: var(--primary-dark);
  color: #fff;
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  z-index: 200;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}

.sidebar-header {
  padding: 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.logo-wrap { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
}

.logo-main { display: block; font-size: 14px; font-weight: 800; line-height: 1.2; }
.logo-sub { display: block; font-size: 10.5px; color: rgba(255,255,255,0.6); }
.sidebar-close { display: none; background: none; border: none; color: rgba(255,255,255,0.6); font-size: 18px; cursor: pointer; }

/* Profil Pengguna Sidebar */
.user-profile-sidebar {
  padding: 12px 14px;
  margin: 10px 10px 4px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 9px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.user-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #0284c7;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.user-info-text { flex: 1; min-width: 0; }
.user-info-name {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: block;
}

.user-role-badge {
  display: inline-block;
  padding: 1px 6px;
  background: rgba(240, 165, 0, 0.3);
  color: #fef08a;
  border-radius: 4px;
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
}

/* Navigasi Scroll */
.nav-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 0 10px;
}
.nav-scroll::-webkit-scrollbar { width: 4px; }
.nav-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

.nav-group { padding: 6px 10px 2px; }
.nav-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: rgba(255,255,255,0.4);
  margin-bottom: 4px;
  padding: 0 8px;
  text-transform: uppercase;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8.5px 12px;
  border-radius: 8px;
  color: rgba(255,255,255,0.75);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s;
  text-decoration: none;
  margin-bottom: 2px;
}

.nav-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
.nav-item.active { background: var(--accent); color: var(--primary-dark); font-weight: 700; }
.nav-item i { width: 18px; text-align: center; font-size: 13px; flex-shrink: 0; }

.sidebar-footer {
  padding: 12px 14px;
  border-top: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.year-badge {
  background: rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 11.5px;
  color: rgba(255,255,255,0.8);
  text-align: center;
}

.btn-logout-sidebar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(220, 38, 38, 0.2);
  color: #fca5a5;
  border: 1px solid rgba(220, 38, 38, 0.35);
  padding: 7px 12px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s;
}
.btn-logout-sidebar:hover { background: var(--danger); color: #fff; }

/* ===== MAIN CONTENT WRAPPER ===== */
.main-wrap {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  width: calc(100% - var(--sidebar-w));
}

/* ===== TOPBAR ===== */
.topbar {
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
}

.menu-btn {
  background: none;
  border: none;
  font-size: 19px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 5px;
  display: none;
}

.topbar-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
  flex: 1;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.tahun-select-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}

.tahun-select-wrap i { color: var(--text-muted); font-size: 12px; }
.tahun-select-wrap select {
  border: none;
  background: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  outline: none;
}

.btn-setup {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  width: 34px;
  height: 34px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-setup:hover { background: var(--primary-dark); }

.topbar-user {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-left: 6px;
  border-left: 1px solid var(--border-subtle);
}

/* ===== PAGE CONTENT ===== */
.page-content {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
}

/* ===== CARDS ===== */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--border-subtle);
  margin-bottom: 20px;
}

.card-header {
  padding: 15px 20px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.card-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-body { padding: 20px; }

/* ===== STAT CARDS ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}

.stat-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border-subtle);
  position: relative;
  overflow: hidden;
}

.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3.5px; }
.stat-card.green::before { background: var(--success); }
.stat-card.blue::before { background: var(--primary); }
.stat-card.orange::before { background: var(--accent); }
.stat-card.red::before { background: var(--danger); }
.stat-card.teal::before { background: #0d9488; }
.stat-card.purple::before { background: #7c3aed; }

.stat-label {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text-muted);
  margin-bottom: 5px;
}

.stat-value {
  font-size: 19px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.25;
}

.stat-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.stat-icon {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 32px;
  opacity: 0.08;
  color: var(--text);
}

/* ===== TABLES ===== */
.table-wrap {
  overflow-x: auto;
  border-radius: 0 0 var(--radius) var(--radius);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead th {
  background: var(--surface2);
  padding: 10px 14px;
  text-align: left;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
}

tbody td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text);
}

tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #f8fafc; }
.tfoot-row td { background: var(--surface2); font-weight: 700; border-top: 2px solid var(--border); }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7.5px 15px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.18s;
  text-decoration: none;
  white-space: nowrap;
}

.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.btn-warning { background: var(--warning); color: #fff; }
.btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline:hover { background: var(--primary); color: #fff; }
.btn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }
.btn-icon { padding: 5px; border-radius: 6px; width: 28px; height: 28px; }
.btn-print { background: var(--primary); color: #fff; }
.btn-print:hover { background: var(--primary-dark); }

/* ===== FORMS ===== */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
}

.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text); }
.form-label.req::after { content: ' *'; color: var(--danger); }

.form-control {
  padding: 8.5px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  background: var(--surface);
  box-sizing: border-box;
}

.form-control:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.12);
}

.form-control::placeholder { color: var(--text-light); }
select.form-control { cursor: pointer; }
textarea.form-control { resize: vertical; min-height: 70px; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  z-index: 300;
  display: none;
}

.modal-box {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--surface);
  border-radius: 14px;
  width: 90%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  z-index: 301;
  display: none;
  box-shadow: var(--shadow-lg);
}

.modal-overlay.open, .modal-box.open { display: block; }

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
}

.modal-header h3 { font-size: 16px; font-weight: 700; color: var(--text); }
.modal-header button { background: none; border: none; font-size: 17px; color: var(--text-muted); cursor: pointer; padding: 4px; }
.modal-body { padding: 20px; }

/* ===== BADGES ===== */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 700;
}
.badge-success { background: var(--success-bg); color: #166534; }
.badge-danger { background: var(--danger-bg); color: #991b1b; }
.badge-warning { background: var(--warning-bg); color: #92400e; }
.badge-info { background: var(--info-bg); color: #0369a1; }
.badge-neutral { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

/* ===== SECTION HEADER & FILTER BAR ===== */
.section-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 18px;
  flex-wrap: wrap;
  gap: 12px;
}

.section-title { font-size: 19px; font-weight: 800; color: var(--text); }
.section-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-bar select, .filter-bar input {
  padding: 7px 11px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  background: var(--surface);
  color: var(--text);
}

/* ===== CHARTS ===== */
.chart-grid {
