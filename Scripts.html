<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// ============================================================
// GLOBAL STATE & DATA
// ============================================================
let currentUser   = null;
let currentPage   = 'dashboard';
let currentTahun   = 2025;
let pengaturan    = {};
let unitList      = [];
let charts        = {};

let filterState = {
  pendapatan:    { bulan: '', unit: '' },
  biayaVariabel: { bulan: '', unit: '' },
  biayaLainnya:  { bulan: '' },
  labaRugi:      { bulan: '' }
};

// ============================================================
// INISIALISASI & AUTENTIKASI
// ============================================================
window.addEventListener('load', () => {
  const curY = new Date().getFullYear();
  const yrEl = document.getElementById('loginYear');
  if (yrEl) yrEl.textContent = curY;
  checkAuth();
});

function checkAuth() {
  try {
    const saved = localStorage.getItem('bumdes_auth') || sessionStorage.getItem('bumdes_auth');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && (parsed.username || parsed.nama)) {
        currentUser = parsed;
        showApp();
        return;
      }
    }
  } catch (e) {
    console.warn('Gagal mem-parse sesi auth:', e);
  }
  showLogin();
}

function showLogin() {
  const loginScreen = document.getElementById('loginScreen');
  const appEl = document.getElementById('app');
  if (loginScreen) {
    loginScreen.style.display = 'flex';
    loginScreen.style.visibility = 'visible';
  }
  if (appEl) {
    appEl.style.display = 'none';
  }

  // Ambil nama BUMDes dari database untuk judul kartu login jika terhubung
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(d => {
        if (d && d.nama_bumdes) {
          const el = document.getElementById('loginBumdesName');
          if (el) el.textContent = d.nama_bumdes;
        }
      })
      .withFailureHandler(() => {})
      .getPengaturan();
  }
}

function showApp() {
  try {
    const loginScreen = document.getElementById('loginScreen');
    const appEl = document.getElementById('app');

    if (loginScreen) loginScreen.style.display = 'none';
    if (appEl) {
      appEl.style.display = 'flex';
    }

    // Update profil sidebar secara aman
    if (currentUser) {
      const uNameEl = document.getElementById('sidebarUserName');
      const uRoleEl = document.getElementById('sidebarUserRole');
      const uAvatarEl = document.getElementById('sidebarUserAvatar');
      const navPengguna = document.getElementById('navPengguna');

      const displayName = currentUser.nama || currentUser.username || 'Pengguna';
      if (uNameEl) uNameEl.textContent = displayName;
      if (uRoleEl) uRoleEl.textContent = currentUser.role || 'Staff';
      if (uAvatarEl) uAvatarEl.textContent = displayName.charAt(0).toUpperCase();

      if (navPengguna) {
        navPengguna.style.display = (currentUser.role === 'Admin') ? 'flex' : 'none';
      }
    }

    // LANGSUNG buka dashboard (jangan tunggu getPengaturan selesai agar tidak blank/macet)
    navigate('dashboard');

    // Muat pengaturan & unit di background secara paralel
    loadPengaturanGlobal();
  } catch (err) {
    console.error('Error saat menampilkan aplikasi:', err);
    const appEl = document.getElementById('app');
    if (appEl) appEl.style.display = 'flex';
    navigate('dashboard');
  }
}

function handleLoginSubmit(e) {
  if (e && e.preventDefault) e.preventDefault();

  const unameEl = document.getElementById('loginUsername');
  const passEl  = document.getElementById('loginPassword');
  const rememberEl = document.getElementById('loginRemember');
  const alertBox = document.getElementById('loginAlert');
  const alertText = document.getElementById('loginAlertText');
  const btnSubmit = document.getElementById('btnLoginSubmit');

  const uname = unameEl ? unameEl.value.trim() : '';
  const pass  = passEl  ? passEl.value.trim() : '';
  const remember = rememberEl ? rememberEl.checked : true;

  if (!uname || !pass) {
    if (alertText) alertText.textContent = 'Harap masukkan nama pengguna dan kata sandi!';
    if (alertBox) alertBox.className = 'login-alert danger show';
    return false;
  }

  if (btnSubmit) {
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = `<i class="fas fa-spinner fa-spin"></i><span>Memverifikasi...</span>`;
  }
  if (alertBox) alertBox.className = 'login-alert danger';

  // Fallback jika preview di luar Google Apps Script
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    setTimeout(() => {
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i class="fas fa-right-to-bracket"></i><span>Masuk ke Sistem</span>`;
      }
      currentUser = { username: uname, nama: uname.toUpperCase(), role: uname === 'admin' ? 'Admin' : 'Staff' };
      showToast('Login berhasil!', 'success');
      showApp();
    }, 400);
    return false;
  }

  google.script.run
    .withSuccessHandler(res => {
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i class="fas fa-right-to-bracket"></i><span>Masuk ke Sistem</span>`;
      }

      if (res && res.success) {
        currentUser = res.user;
        try {
          if (remember) {
            localStorage.setItem('bumdes_auth', JSON.stringify(currentUser));
          } else {
            sessionStorage.setItem('bumdes_auth', JSON.stringify(currentUser));
          }
        } catch (storageErr) {
          console.warn('Gagal menyimpan sesi di browser:', storageErr);
        }
        showToast('Selamat datang, ' + (currentUser.nama || currentUser.username) + '!', 'success');
        showApp();
      } else {
        if (alertText) alertText.textContent = (res && res.message) ? res.message : 'Username atau password salah!';
        if (alertBox) alertBox.className = 'login-alert danger show';
      }
    })
    .withFailureHandler(err => {
      if (btnSubmit) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i class="fas fa-right-to-bracket"></i><span>Masuk ke Sistem</span>`;
      }
      if (alertText) alertText.textContent = 'Gagal terhubung ke Google Sheets: ' + (err.message || err);
      if (alertBox) alertBox.className = 'login-alert danger show';
    })
    .loginUser(uname, pass);

  return false;
}

function quickFillLogin(user, pass) {
  const unameEl = document.getElementById('loginUsername');
  const passEl  = document.getElementById('loginPassword');
  const alertEl = document.getElementById('loginAlert');
  if (unameEl) unameEl.value = user;
  if (passEl) passEl.value = pass;
  if (alertEl) alertEl.className = 'login-alert danger';
  if (passEl) passEl.focus();
}

function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;
  const isPass = input.type === 'password';
  input.type = isPass ? 'text' : 'password';
  const icon = btn.querySelector('i');
  if (icon) {
    icon.className = isPass ? 'fas fa-eye-slash' : 'fas fa-eye';
  }
}

function alertDemoHelp() {
  alert('Gunakan akun demo bawaan:\n• Admin: admin / admin123\n• Bendahara: bendahara / bendahara123\n• Pengawas: pengawas / pengawas123\n\nJika ini pertama kali dijalankan, klik tombol database di kanan atas setelah login untuk inisialisasi sheet.');
}

function confirmLogout() {
  if (confirm('Apakah Anda yakin ingin keluar dari sistem?')) {
    logout();
  }
}

function logout() {
  try {
    localStorage.removeItem('bumdes_auth');
    sessionStorage.removeItem('bumdes_auth');
  } catch(e) {}
  currentUser = null;
  showToast('Anda telah keluar.', 'info');
  showLogin();
}

// ============================================================
// PENGATURAN GLOBAL & TAHUN AKTIF
// ============================================================
function loadPengaturanGlobal(callback) {
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    if (typeof callback === 'function') callback();
    return;
  }

  google.script.run
    .withSuccessHandler(d => {
      try {
        pengaturan = d || {};
        const orgEl = document.getElementById('namaOrg');
        const desaEl = document.getElementById('namaDesa');
        if (orgEl) orgEl.textContent = d.nama_bumdes || 'BUMDes';
        if (desaEl) desaEl.textContent = d.nama_desa || 'Sistem Keuangan';

        // Sinkronkan pilihan tahun
        if (d.tahun_aktif) {
          const t = parseInt(d.tahun_aktif);
          if (t && t !== currentTahun) {
            currentTahun = t;
            const tahunAktifEl = document.getElementById('tahunAktif');
            if (tahunAktifEl) tahunAktifEl.textContent = currentTahun;
            // Jika tahun aktif diperbarui dan pengguna sedang di dashboard, muat ulang dashboard
            if (currentPage === 'dashboard') {
              loadDashboard();
            }
          }
        }

        // Isi opsi tahun di select jika tersedia
        const tahunSel = document.getElementById('globalTahun');
        if (tahunSel) {
          const years = (d.available_years && d.available_years.length > 0) ? d.available_years : [new Date().getFullYear()];
          let optHtml = `<option value="all" ${currentTahun === 'all' ? 'selected' : ''}>Semua Tahun</option>`;
          optHtml += years.map(y => `<option value="${y}" ${String(y) === String(currentTahun) ? 'selected' : ''}>${y}</option>`).join('');
          tahunSel.innerHTML = optHtml;
        }

        const tahunAktifEl = document.getElementById('tahunAktif');
        if (tahunAktifEl) tahunAktifEl.textContent = (currentTahun === 'all') ? 'Semua Tahun' : currentTahun;
      } catch (err) {
        console.warn('Gagal memproses pengaturan:', err);
      }

      if (typeof callback === 'function') callback();
    })
    .withFailureHandler(err => {
      console.warn('Gagal memuat pengaturan:', err);
      if (typeof callback === 'function') callback();
    })
    .getPengaturan();

  google.script.run
    .withSuccessHandler(d => { unitList = d || []; })
    .withFailureHandler(err => { console.warn('Gagal memuat unit:', err); })
    .getUnitUsaha();
}

function onTahunChange(val) {
  currentTahun = (val === 'all' || val === 'semua' || !val) ? 'all' : (parseInt(val) || new Date().getFullYear());
  const tahunAktifEl = document.getElementById('tahunAktif');
  if (tahunAktifEl) tahunAktifEl.textContent = (currentTahun === 'all') ? 'Semua Tahun' : currentTahun;
  const sel = document.getElementById('globalTahun');
  if (sel) sel.value = currentTahun;
  navigate(currentPage);
}

function runSetup() {
  if (!confirm('Inisialisasi & sinkronkan database sekarang? Data transaksi yang ada tidak akan terhapus.')) return;
  showToast('Menginisialisasi sheet...', 'info');
  google.script.run
    .withSuccessHandler(r => {
      showToast(r.message || 'Setup database berhasil!', 'success');
      loadPengaturanGlobal(() => navigate(currentPage));
    })
    .withFailureHandler(err => {
      showToast('Gagal setup: ' + err.message, 'error');
    })
    .setupSpreadsheet();
}

// ============================================================
// ROUTING & NAVIGASI
// ============================================================
const PAGE_TITLES = {
  dashboard:     'Dashboard Keuangan',
  modal:         'Penyertaan Modal',
  pendapatan:    'Pendapatan Usaha',
  biaya_variabel:'Biaya Variabel (HPP)',
  biaya_lainnya: 'Biaya Operasional',
  anggaran:      'RAB Anggaran',
  alokasi_pad:   'Alokasi PAD',
  laba_rugi:     'Laporan Laba Rugi',
  arus_kas:      'Laporan Arus Kas',
  neraca:        'Neraca Keuangan',
  kas:           'Buku Kas Umum',
  unit_usaha:    'Master Unit Usaha',
  pengguna:      'Manajemen Pengguna',
  pengaturan:    'Pengaturan Sistem'
};

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.page === page));
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page] || page;

  setContent('<div class="loading-state"><div class="spinner"></div><p>Memuat data...</p></div>');

  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} });
  charts = {};

  const routes = {
    dashboard:      loadDashboard,
    modal:          loadModal,
    pendapatan:     loadPendapatan,
    biaya_variabel: loadBiayaVariabel,
    biaya_lainnya:  loadBiayaLainnya,
    anggaran:       loadAnggaran,
    alokasi_pad:    loadAlokasiPAD,
    laba_rugi:      loadLabaRugi,
    arus_kas:       loadArusKas,
    neraca:         loadNeraca,
    kas:            loadKas,
    unit_usaha:     loadUnitUsaha,
    pengguna:       loadPenggunaPage,
    pengaturan:     loadPengaturanPage
  };

  (routes[page] || (() => setContent('<div class="empty-state"><i class="fas fa-question-circle"></i><p>Halaman tidak ditemukan</p></div>')))();

  if (window.innerWidth < 900) closeSidebar();
}

function setContent(html) { document.getElementById('pageContent').innerHTML = html; }
function toggleSidebar()  { document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebar()   { document.getElementById('sidebar').classList.remove('open'); }

// ============================================================
// DASHBOARD
// ============================================================
function loadDashboard() {
  google.script.run
    .withSuccessHandler(res => {
      const s = (res && res.summary) ? res.summary : {};
      const pos = (s.labaBersih || 0) >= 0;

      setContent(`
        <div class="section-header">
          <div>
            <div class="section-title">Ringkasan Keuangan ${currentTahun === 'all' ? '(Semua Tahun)' : 'Tahun ' + currentTahun}</div>
            <div class="section-sub">${pengaturan.nama_bumdes || 'BUMDes'} — Desa ${pengaturan.nama_desa || ''}</div>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="navigate('pendapatan')"><i class="fas fa-plus"></i> Catat Transaksi</button>
            <button class="btn btn-outline" onclick="navigate('laba_rugi')"><i class="fas fa-print"></i> Cetak Laporan</button>
          </div>
        </div>

        ${(currentTahun !== 'all' && (s.totalTransaksi === 0) && (s.grandTotalTransaksi > 0)) ? `
        <div style="background:var(--primary-subtle);border-left:4px solid var(--primary);padding:14px 18px;border-radius:10px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:var(--shadow)">
          <div style="display:flex;align-items:center;gap:12px">
            <i class="fas fa-info-circle" style="color:var(--primary);font-size:22px"></i>
            <div>
              <div style="font-weight:700;color:var(--primary-dark)">Data Ditemukan di Spreadsheet</div>
              <div style="font-size:12.5px;color:var(--text)">Tidak ada transaksi untuk filter tahun ${currentTahun}, namun ditemukan <strong>${s.grandTotalTransaksi} transaksi</strong> di sheet pada tahun lain.</div>
            </div>
          </div>
          <button class="btn btn-sm btn-primary" onclick="onTahunChange('all')"><i class="fas fa-calendar-check"></i> Tampilkan Semua Tahun (${s.grandTotalTransaksi} Data)</button>
        </div>` : ''}

        <div class="stats-grid">
          <div class="stat-card green">
            <div class="stat-label">Total Pendapatan</div>
            <div class="stat-value rupiah text-green">${fRp(s.totalPendapatan)}</div>
            <div class="stat-sub">${currentTahun === "all" ? "Seluruh Transaksi" : "Tahun Buku " + currentTahun}</div>
            <i class="fas fa-arrow-trend-up stat-icon"></i>
          </div>

          <div class="stat-card red">
            <div class="stat-label">Total Beban/Biaya</div>
            <div class="stat-value rupiah text-red">${fRp(s.totalBiaya)}</div>
            <div class="stat-sub">HPP + Operasional</div>
            <i class="fas fa-arrow-trend-down stat-icon"></i>
          </div>

          <div class="stat-card ${pos ? 'blue' : 'red'}">
            <div class="stat-label">Laba Bersih</div>
            <div class="stat-value rupiah ${pos ? 'text-blue' : 'text-red'}">${fRp(s.labaBersih)}</div>
            <div class="stat-sub">${pos ? 'Surplus Usaha' : 'Defisit Usaha'}</div>
            <i class="fas fa-scale-balanced stat-icon"></i>
          </div>

          <div class="stat-card orange">
            <div class="stat-label">Saldo Kas</div>
            <div class="stat-value rupiah">${fRp(s.saldoKas)}</div>
            <div class="stat-sub">Posisi Kas Berjalan</div>
            <i class="fas fa-wallet stat-icon"></i>
          </div>

          <div class="stat-card teal">
            <div class="stat-label">Total Modal</div>
            <div class="stat-value rupiah">${fRp(s.totalModal)}</div>
            <div class="stat-sub">Penyertaan Modal Desa</div>
            <i class="fas fa-hand-holding-dollar stat-icon"></i>
          </div>

          <div class="stat-card purple">
            <div class="stat-label">Unit Usaha</div>
            <div class="stat-value">${s.unitAktif || 0} Unit</div>
            <div class="stat-sub">${s.totalTransaksi || 0} Transaksi ${currentTahun}</div>
            <i class="fas fa-store stat-icon"></i>
          </div>
        </div>

        <div class="chart-grid">
          <div class="card chart-wrap">
            <div class="card-header">
              <div class="card-title"><i class="fas fa-chart-column"></i> Tren Pendapatan &amp; Biaya (Bulanan)</div>
            </div>
            <canvas id="cTrend" height="210"></canvas>
          </div>

          <div class="card chart-wrap">
            <div class="card-header">
              <div class="card-title"><i class="fas fa-chart-pie"></i> Komposisi Biaya &amp; Laba</div>
            </div>
            <div id="pieWrap">
              <canvas id="cPie" height="210"></canvas>
            </div>
          </div>
        </div>`);

      const trend = (res && res.trend) ? res.trend : [];
      const labels = trend.map(t => BULAN_S[t.bulan]);

      // Render Bar Chart
      if (window.Chart) {
        try {
          const ctxTrend = document.getElementById('cTrend');
          if (ctxTrend) {
            charts.trend = new Chart(ctxTrend.getContext('2d'), {
              type: 'bar',
              data: {
                labels,
                datasets: [
                  { label: 'Pendapatan', data: trend.map(t => t.pendapatan), backgroundColor: 'rgba(22,163,74,.8)', borderRadius: 5 },
                  { label: 'Total Biaya', data: trend.map(t => t.biaya),      backgroundColor: 'rgba(220,38,38,.8)',  borderRadius: 5 },
                  { label: 'Laba Bersih', data: trend.map(t => t.laba), type: 'line', borderColor: '#0f4c81',
                    backgroundColor: 'rgba(15,76,129,.1)', tension: 0.35, fill: true, pointRadius: 4 }
                ]
              },
              options: {
                responsive: true,
                plugins: { legend: { position: 'top' } },
                scales: { y: { ticks: { callback: v => 'Rp ' + fK(v) } } }
              }
            });
          }

          // Render Doughnut Chart
          const ctxPie = document.getElementById('cPie');
          const bvVal = s.totalBiayaVariabel || 0;
          const blVal = s.totalBiayaLainnya || 0;
          const lbVal = Math.max(0, s.labaBersih || 0);

          if (bvVal + blVal + lbVal === 0) {
            document.getElementById('pieWrap').innerHTML = `
              <div class="empty-state" style="padding:40px 10px">
                <i class="fas fa-chart-pie"></i>
                <p>Belum ada data pendapatan/biaya pada tahun ${currentTahun}</p>
                <div style="font-size:12px;color:var(--text-muted);margin-top:4px">Catat pendapatan atau pilih tahun buku lain di menu atas</div>
              </div>`;
          } else if (ctxPie) {
            charts.pie = new Chart(ctxPie.getContext('2d'), {
              type: 'doughnut',
              data: {
                labels: ['Biaya Variabel (HPP)', 'Biaya Operasional', 'Laba Bersih'],
                datasets: [{
                  data: [bvVal, blVal, lbVal],
                  backgroundColor: ['#f59e0b', '#ef4444', '#16a34a'],
                  borderWidth: 2,
                  borderColor: '#fff'
                }]
              },
              options: {
                responsive: true,
                plugins: { legend: { position: 'bottom' } },
                cutout: '65%'
              }
            });
          }
        } catch (chartErr) {
          console.warn('Gagal render chart:', chartErr);
        }
      }
    })
    .withFailureHandler(err => {
      setContent(`
        <div class="empty-state text-red">
          <i class="fas fa-triangle-exclamation"></i>
          <p>Gagal memuat data dashboard: ${err.message}</p>
          <button class="btn btn-primary mt-4" onclick="loadDashboard()">Coba Muat Ulang</button>
        </div>`);
    })
    .getDashboardData(currentTahun);
}

// ============================================================
// PENYERTAAN MODAL
// ============================================================
function loadModal() {
  google.script.run
    .withSuccessHandler(rows => {
      rows = rows || [];
      const total = rows.reduce((s, r) => s + (parseNumber(r.Jumlah) || 0), 0);
      let h = `
        <div class="section-header">
          <div>
            <div class="section-title">Penyertaan Modal Desa</div>
            <div class="section-sub">Total Modal Terhimpun: <strong>${fRp(total)}</strong></div>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="openFormModal()"><i class="fas fa-plus"></i> Tambah Modal</button>
          </div>
        </div>
        <div class="card"><div class="table-wrap"><table>
          <thead><tr><th>Tanggal</th><th>Sumber Modal</th><th>Keterangan</th><th>Jenis</th><th class="text-right">Jumlah</th><th>Status</th><th class="text-center">Aksi</th></tr></thead>
          <tbody>`;

      if (!rows.length) {
        h += `<tr><td colspan="7"><div class="empty-state"><i class="fas fa-hand-holding-dollar"></i><p>Belum ada data modal penyertaan pada tahun ${currentTahun}</p></div></td></tr>`;
      }

      rows.forEach(r => {
        h += `<tr>
          <td>${fDate(r.Tanggal)}</td>
          <td><strong>${r.Sumber_Modal || ''}</strong></td>
          <td>${r.Keterangan || '-'}</td>
          <td><span class="badge badge-info">${r.Jenis || 'Tunai'}</span></td>
          <td class="text-right rupiah fw-bold text-blue">${fRp(r.Jumlah)}</td>
          <td><span class="badge badge-success">${r.Status || 'Aktif'}</span></td>
          <td class="text-center">
            <button class="btn btn-sm btn-ghost btn-icon" title="Edit" onclick='openFormModal(${JSON.stringify(r)})'><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-danger btn-icon" title="Hapus" onclick="hapusModal('${r.ID}')"><i class="fas fa-trash"></i></button>
          </td></tr>`;
      });

      h += `</tbody><tfoot><tr class="tfoot-row"><td colspan="4"><strong>TOTAL MODAL</strong></td>
        <td class="text-right rupiah">${fRp(total)}</td><td colspan="2"></td></tr></tfoot></table></div></div>`;
      setContent(h);
    })
    .withFailureHandler(err => {
      setContent(`<div class="empty-state text-red"><p>Gagal memuat modal: ${err.message}</p></div>`);
    })
    .getModal({ tahun: currentTahun });
}

function openFormModal(d) {
  d = d || {};
  document.getElementById('modalTitle').textContent = d.ID ? 'Edit Modal' : 'Tambah Penyertaan Modal';
  document.getElementById('modalBody').innerHTML = `
    <div class="form-grid">
      <div class="form-group"><label class="form-label req">Tanggal</label>

// ============================================================
function loadAnggaran() {
  google.script.run
    .withSuccessHandler(rows => {
      rows = rows || [];
      const tA = rows.reduce((s, r) => s + (parseNumber(r.Anggaran) || 0), 0);
      const tR = rows.reduce((s, r) => s + (parseNumber(r.Realisasi) || 0), 0);
      const pct = tA > 0 ? Math.round((tR / tA) * 100) : 0;

      let h = `
        <div class="section-header">
          <div>
            <div class="section-title">Rencana Anggaran Biaya (RAB) ${currentTahun}</div>
            <div class="section-sub">Pagu Anggaran vs Realisasi Berjalan</div>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="openFormAng()"><i class="fas fa-plus"></i> Tambah Anggaran</button>
          </div>
        </div>

        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">
          <div class="stat-card blue"><div class="stat-label">Pagu Anggaran</div><div class="stat-value rupiah">${fRp(tA)}</div></div>
          <div class="stat-card green"><div class="stat-label">Total Realisasi</div><div class="stat-value rupiah">${fRp(tR)}</div></div>
          <div class="stat-card ${pct > 100 ? 'red' : 'orange'}"><div class="stat-label">Tingkat Penyerapan</div><div class="stat-value">${pct}%</div></div>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <div class="progress-wrap">
              <div class="progress-label">
                <span>Penyerapan Anggaran Tahun ${currentTahun}</span>
                <strong>${pct}%</strong>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width:${Math.min(pct, 100)}%;background:${pct > 100 ? 'var(--danger)' : pct > 75 ? 'var(--success)' : 'var(--primary)'}"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="card"><div class="table-wrap"><table>
          <thead><tr><th>Unit</th><th>Bulan</th><th>Kategori</th><th>Uraian</th><th class="text-right">Pagu</th><th class="text-right">Realisasi</th><th class="text-right">Sisa Pagu</th><th class="text-center">Aksi</th></tr></thead>
          <tbody>`;

      if (!rows.length) {
        h += `<tr><td colspan="8"><div class="empty-state"><i class="fas fa-clipboard-list"></i><p>Belum ada anggaran pada tahun ${currentTahun}</p></div></td></tr>`;
      }

      rows.forEach(r => {
        const sisa = (parseNumber(r.Anggaran) || 0) - (parseNumber(r.Realisasi) || 0);
        h += `<tr>
          <td><strong>${r.Unit_Usaha || 'Umum'}</strong></td>
          <td>${BULAN[parseInt(r.Bulan)] || r.Bulan}</td>
          <td><span class="badge badge-info">${r.Kategori || '-'}</span></td>
          <td>${r.Uraian || '-'}</td>
          <td class="text-right rupiah">${fRp(r.Anggaran)}</td>
          <td class="text-right rupiah">${fRp(r.Realisasi)}</td>
          <td class="text-right rupiah ${sisa < 0 ? 'text-red' : 'text-green'}"><strong>${fRp(sisa)}</strong></td>
          <td class="text-center">
            <button class="btn btn-sm btn-ghost btn-icon" title="Edit" onclick='openFormAng(${JSON.stringify(r)})'><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-danger btn-icon" title="Hapus" onclick="hapusAng('${r.ID}')"><i class="fas fa-trash"></i></button>
          </td></tr>`;
      });

      h += `</tbody></table></div></div>`;
      setContent(h);
    })
    .withFailureHandler(err => {
      setContent(`<div class="empty-state text-red"><p>Gagal memuat anggaran: ${err.message}</p></div>`);
    })
    .getAnggaran({ tahun: currentTahun });
}

function saveAng(id) {

}

function updatePADTotal() {
  const t = ['alPAD', 'alPeng', 'alPgrs', 'alCad', 'alSos'].reduce((s, id) => s + (parseFloat(document.getElementById(id).value) || 0), 0);
  const el = document.getElementById('alTotal');
  el.value = t;
  el.style.color = (t === 100) ? 'var(--success)' : 'var(--danger)';
}

function savePAD() {
  const t = ['alPAD', 'alPeng', 'alPgrs', 'alCad', 'alSos'].reduce((s, id) => s + (parseFloat(document.getElementById(id).value) || 0), 0);
  if (t !== 100) { showToast('Total persentase harus 100%!', 'error'); return; }

  const data = {
    Tahun: v('alTahun'),
    Bulan: v('alBulan'),
    Total_Laba: v('alLaba'),
    PAD_Desa_Pct: v('alPAD'),
    Pengembangan_Pct: v('alPeng'),
    Pengurus_Pct: v('alPgrs'),
    Cadangan_Pct: v('alCad'),
    Sosial_Pct: v('alSos'),
    Tanggal_Alokasi: v('alTgl')
  };

  showToast('Menyimpan...', 'info');
  google.script.run
    .withSuccessHandler(r => {
      if (r.success) {
        showToast('Alokasi PAD berhasil disimpan!', 'success');
        closeModal();
        loadAlokasiPAD();

    .saveAlokasiPAD(data);
}

function openFormUnit(d) {
  d = d || {};
  document.getElementById('modalTitle').textContent = d.ID ? 'Edit Unit Usaha' : 'Tambah Unit Usaha';
  document.getElementById('modalBody').innerHTML = `
    <div class="form-grid">
      <div class="form-group full"><label class="form-label req">Nama Unit Usaha</label>
        <input type="text" class="form-control" id="uNama" value="${d.Nama_Unit || ''}" placeholder="misal: Unit Air Bersih" required></div>
      <div class="form-group"><label class="form-label">Jenis Usaha</label>
        <select class="form-control" id="uJenis">
          ${['Perdagangan', 'Jasa Layanan', 'Pertanian & Peternakan', 'Pariwisata & Hiburan', 'Pengelolaan Sampah & Air', 'Industri Kreatif / Rumahan', 'Simpan Pinjam', 'Lainnya']
            .map(j => `<option value="${j}" ${d.Jenis_Usaha === j ? 'selected' : ''}>${j}</option>`).join('')}
        </select></div>
      <div class="form-group"><label class="form-label">Penanggung Jawab</label>
        <input type="text" class="form-control" id="uPJ" value="${d.Penanggung_Jawab || ''}" placeholder="Nama penanggung jawab"></div>
      <div class="form-group"><label class="form-label">Modal Awal Unit (Rp)</label>
        <input type="number" class="form-control" id="uModal" value="${d.Modal_Awal || 0}" placeholder="0"></div>
      <div class="form-group"><label class="form-label">Tanggal Berdiri</label>
        <input type="date" class="form-control" id="uTgl" value="${d.Tanggal_Berdiri ? fDateInput(d.Tanggal_Berdiri) : today()}"></div>
      <div class="form-group"><label class="form-label">Status Unit</label>
        <select class="form-control" id="uStatus">
          <option value="Aktif" ${d.Status === 'Aktif' || !d.ID ? 'selected' : ''}>Aktif</option>
          <option value="Tidak Aktif" ${d.Status === 'Tidak Aktif' ? 'selected' : ''}>Tidak Aktif</option>
        </select></div>
      <div class="form-group full"><label class="form-label">Keterangan</label>
        <textarea class="form-control" id="uKet">${d.Keterangan || ''}</textarea></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveUnit('${d.ID || ''}')"><i class="fas fa-save"></i> Simpan</button>
    </div>`;
  openModal();
}

function saveUnit(id) {
  const data = {
    ID: id,
    Nama_Unit: v('uNama'),
    Jenis_Usaha: v('uJenis'),
    Penanggung_Jawab: v('uPJ'),
    Modal_Awal: v('uModal'),
    Tanggal_Berdiri: v('uTgl'),
    Status: v('uStatus'),
    Keterangan: v('uKet')
  };
  if (!data.Nama_Unit) { showToast('Nama unit usaha wajib diisi!', 'error'); return; }
  showToast('Menyimpan...', 'info');
  google.script.run
    .withSuccessHandler(r => {
      if (r.success) { showToast('Unit usaha disimpan!', 'success'); closeModal(); loadUnitUsaha(); }
    })
    .withFailureHandler(err => showToast('Error: ' + err.message, 'error'))
    .saveUnitUsaha(data);
}

function hapusUnit(id) {
  if (!confirm('Hapus unit usaha ini?')) return;
  google.script.run
    .withSuccessHandler(r => {
      if (r.success) { showToast('Unit usaha dihapus', 'success'); loadUnitUsaha(); }
    })
    .deleteUnitUsaha(id);
}

function v(id) { const el = document.getElementById(id); return el ? el.value : ''; }

function parseNumber(val) {
  if (val === null || val === undefined || val === '') return 0;
  if (typeof val === 'number') return isNaN(val) ? 0 : val;
  let s = String(val).trim();
  if (!s) return 0;
  let isNegative = false;
  if (s.indexOf('(') === 0 && s.indexOf(')') === s.length - 1) {
    isNegative = true;
    s = s.slice(1, -1).trim();
  } else if (s.indexOf('-') === 0) {
    isNegative = true;
    s = s.slice(1).trim();
  }
  s = s.replace(/^(Rp|IDR)\.?\s*/i, '').trim();
  if (s.indexOf('.') >= 0 && s.indexOf(',') >= 0) {
    if (s.lastIndexOf('.') < s.lastIndexOf(',')) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else {
      s = s.replace(/,/g, '');
    }
  } else if (s.indexOf('.') >= 0) {
    const parts = s.split('.');
    if (parts.length > 2) {
      s = s.replace(/\./g, '');
    } else if (parts.length === 2 && parts[1].length === 3) {
      s = parts[0] + parts[1];
    }
  } else if (s.indexOf(',') >= 0) {
    const parts = s.split(',');
    if (parts.length > 2) {
      s = s.replace(/,/g, '');
    } else if (parts.length === 2) {
      if (parts[1].length === 3) {
        s = parts[0] + parts[1];
      } else {
        s = parts[0] + '.' + parts[1];
      }
    }
  }
  s = s.replace(/[^0-9.-]/g, '');
  const n = parseFloat(s);
  if (isNaN(n)) return 0;
  return isNegative ? -n : n;
}

const INDO_MONTHS = {
  januari: 1, jan: 1,
  februari: 2, pebruari: 2, feb: 2,
  maret: 3, mar: 3,
  april: 4, apr: 4,
  mei: 5, may: 5,
  juni: 6, jun: 6,
  juli: 7, jul: 7,
  agustus: 8, ags: 8, agu: 8, aug: 8,
  september: 9, sep: 9, sept: 9,
  oktober: 10, okt: 10, oct: 10,
  november: 11, nopember: 11, nov: 11,
  desember: 12, des: 12, dec: 12
};

function parseDateInfo(val) {
  if (val === null || val === undefined || val === '') return null;
  if (val instanceof Date && !isNaN(val.getTime())) {
    const y = val.getFullYear();
    const m = val.getMonth() + 1;
    const d = val.getDate();
    return { year: y, month: m, day: d, formatted: y + '-' + String(m < 10 ? '0' + m : m) + '-' + String(d < 10 ? '0' + d : d) };
  }
  if (typeof val === 'number' && val > 20000 && val < 80000) {
    const dt = new Date(Math.round((val - 25569) * 86400 * 1000));
    if (!isNaN(dt.getTime())) {
      const y = dt.getUTCFullYear();
      const m = dt.getUTCMonth() + 1;
      const d = dt.getUTCDate();
      return { year: y, month: m, day: d, formatted: y + '-' + String(m < 10 ? '0' + m : m) + '-' + String(d < 10 ? '0' + d : d) };
    }
  }
  const s = String(val).trim();
  if (!s) return null;
  let match = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (match) {
    const y = parseInt(match[1], 10);
    const m = parseInt(match[2], 10);
    const d = parseInt(match[3], 10);
    return { year: y, month: m, day: d, formatted: y + '-' + String(m < 10 ? '0' + m : m) + '-' + String(d < 10 ? '0' + d : d) };
  }
  match = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
  if (match) {
    const d = parseInt(match[1], 10);
    const m = parseInt(match[2], 10);
    const y = parseInt(match[3], 10);
    return { year: y, month: m, day: d, formatted: y + '-' + String(m < 10 ? '0' + m : m) + '-' + String(d < 10 ? '0' + d : d) };
  }
  match = s.match(/^(\d{1,2})\s*[-/ ]\s*([a-zA-Z]+)\s*[-/ ]\s*(\d{4})/);
  if (match) {
    const d = parseInt(match[1], 10);
    const m = INDO_MONTHS[match[2].toLowerCase()];
    const y = parseInt(match[3], 10);
    if (m) return { year: y, month: m, day: d, formatted: y + '-' + String(m < 10 ? '0' + m : m) + '-' + String(d < 10 ? '0' + d : d) };
  }
  match = s.match(/^([a-zA-Z]+)\s*[-/ ]\s*(\d{4})/);
  if (match) {
    const m = INDO_MONTHS[match[1].toLowerCase()];
    const y = parseInt(match[2], 10);
    if (m) return { year: y, month: m, day: 1, formatted: y + '-' + String(m < 10 ? '0' + m : m) + '-01' };
  }
  match = s.match(/^(\d{4})$/);
  if (match) {
    const y = parseInt(match[1], 10);
    if (y > 2000 && y < 2100) return { year: y, month: 1, day: 1, formatted: y + '-01-01' };
  }
  if (/\d+/.test(s) && (s.indexOf('-') >= 0 || s.indexOf('/') >= 0 || s.indexOf('.') >= 0)) {
    const dt = new Date(s);
    if (!isNaN(dt.getTime())) {
      const y = dt.getFullYear();
      const m = dt.getMonth() + 1;
      const d = dt.getDate();
      return { year: y, month: m, day: d, formatted: y + '-' + String(m < 10 ? '0' + m : m) + '-' + String(d < 10 ? '0' + d : d) };
    }
  }
  return null;
}

function fRp(n) {
  const num = parseNumber(n);
  if (Math.abs(num) >= 1e9) return 'Rp ' + (num / 1e9).toFixed(1) + ' M';
  if (Math.abs(num) >= 1e6) return 'Rp ' + (num / 1e6).toFixed(1) + ' jt';
  return 'Rp ' + num.toLocaleString('id-ID');
}

function fRpFull(n) {
  const num = parseNumber(n);
  return num.toLocaleString('id-ID');
}

function fK(n) {
  const num = parseNumber(n);
  if (Math.abs(num) >= 1e9) return (num / 1e9).toFixed(1) + 'M';
  if (Math.abs(num) >= 1e6) return (num / 1e6).toFixed(1) + 'jt';
  if (Math.abs(num) >= 1e3) return (num / 1e3).toFixed(0) + 'rb';
  return num;
}

function fDate(d) {
  if (!d) return '-';
  try {
    const s = String(d).trim();
    const p = parseDateInfo(s);
    if (p) {
      const dt = new Date(p.year, p.month - 1, p.day);
      return dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    return s;
  } catch (e) {
    return String(d);
  }
}

function fDateInput(d) {
  if (!d) return '';
  try {
    const s = String(d).trim();
    let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (m) {
      return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    }
    m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
    if (m) {
      return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
    }
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return '';
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  } catch (e) {
    return '';
  }
}

function today() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}
